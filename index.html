<style>*,*::before,*::after{box-sizing:border-box}*{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* NOXCAT FIGHT standalone multiplayer.
   Off claude.ai there is no built-in room, so this file provides the same small room API
   (presence / peers / onPeers / onConnection) over WebRTC with PeerJS.
   The player who opens a room becomes the hub: every guest sends its presence to the hub,
   and the hub relays everyone's presence to everyone ~20 times a second.
   Invite links look like  https://your-site/?r=AB12C  */
(function(){
  if (window.claude && typeof window.claude.use === 'function') return; // running inside claude.ai: use the platform room
  if (typeof Peer !== 'function') return;                                 // PeerJS failed to load: single player only
  var PREFIX = 'noxcatfight-v1-';
  var qs = new URLSearchParams(location.search);
  var code = (qs.get('r') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  var myLabel = 'p' + Math.random().toString(36).slice(2, 10);
  var mine = {}, meObj = null, cache = null;
  var others = new Map();            // label -> {str, obj}
  var subs = [], csubs = [], connected = false;
  var peer = null, hubConn = null, conns = new Map(), isHub = false, relay = null;
  var api = { status: code ? 'joining' : 'idle', code: code,
    shareUrl: function(){ return location.origin + location.pathname + '?r=' + code; } };
  window.NOX_P2P = api;

  function mk(label, pres, me){ return Object.freeze({peer:label, by:null, isMe:me, sameTab:me, kind:'viewer', guest:false, presence:pres, updatedAt:Date.now()}); }
  meObj = mk(myLabel, Object.freeze({}), true);
  function rebuild(){
    var arr = [meObj]; others.forEach(function(o){ arr.push(o.obj); });
    cache = Object.freeze(arr);
    var ch = {peers:cache, joined:[], left:[], updated:[]};
    subs.forEach(function(f){ try{ f(ch); }catch(e){} });
  }
  function setConn(c){ connected = c; csubs.forEach(function(f){ try{ f(c); }catch(e){} }); }
  function upsert(label, pres){
    if (label === myLabel || !pres || typeof pres !== 'object') return false;
    var str = JSON.stringify(pres), o = others.get(label);
    if (o && o.str === str) return false;
    others.set(label, {str:str, obj:mk(label, Object.freeze(pres), false)}); return true;
  }
  function replaceAll(map){
    var changed = false, seen = {};
    Object.keys(map).forEach(function(l){ if (l === myLabel) return; seen[l] = 1; if (upsert(l, map[l])) changed = true; });
    others.forEach(function(_, l){ if (!seen[l]) { others.delete(l); changed = true; } });
    if (changed) rebuild();
  }

  // ---- hub (room owner) ----
  function startHub(){
    if (isHub) return;
    if (peer) { try{ peer.destroy(); }catch(e){} peer = null; hubConn = null; others.clear(); rebuild(); }
    code = Math.random().toString(36).slice(2, 7).toUpperCase(); api.code = code;
    isHub = true; api.status = 'connecting';
    peer = new Peer(PREFIX + code, Object.assign({debug:0}, window.NOX_PEER_OPTS || {}));
    peer.on('open', function(){ api.status = 'hosting'; setConn(true);
      try{ history.replaceState(null, '', location.pathname + '?r=' + code); }catch(e){} });
    peer.on('error', function(e){
      if (e && e.type === 'unavailable-id') { isHub = false; try{ peer.destroy(); }catch(_){} peer = null; startHub(); return; }
      api.status = 'error'; api.error = e && e.type;
    });
    peer.on('connection', function(c){
      c.on('open', function(){ conns.set(c.connectionId || c.peer, c); });
      c.on('data', function(d){
        try{ var m = typeof d === 'string' ? JSON.parse(d) : d;
          if (m && m.t === 'p' && typeof m.label === 'string') { c._label = m.label; if (upsert(m.label, m.presence)) rebuild(); }
        }catch(e){}
      });
      c.on('close', function(){ conns.delete(c.connectionId || c.peer); if (c._label && others.delete(c._label)) rebuild(); });
    });
    if (!relay) relay = setInterval(function(){
      if (!isHub || !conns.size) return;
      var all = {}; all[myLabel] = mine; others.forEach(function(o, l){ all[l] = JSON.parse(o.str); });
      var msg = JSON.stringify({t:'all', all:all});
      conns.forEach(function(c){ if (c.open) { try{ c.send(msg); }catch(e){} } });
    }, 50);
  }

  // ---- guest ----
  function sendMine(){ if (hubConn && hubConn.open) { try{ hubConn.send(JSON.stringify({t:'p', label:myLabel, presence:mine})); }catch(e){} } }
  function join(){
    api.status = 'joining';
    peer = new Peer(undefined, Object.assign({debug:0}, window.NOX_PEER_OPTS || {}));
    peer.on('open', function(){
      hubConn = peer.connect(PREFIX + code, {reliable:true, serialization:'raw'});
      hubConn.on('open', function(){ api.status = 'joined'; setConn(true); sendMine(); });
      hubConn.on('data', function(d){
        try{ var m = typeof d === 'string' ? JSON.parse(d) : d; if (m && m.t === 'all' && m.all) replaceAll(m.all); }catch(e){}
      });
      hubConn.on('close', function(){ if (isHub) return; api.status = 'lost'; others.clear(); rebuild(); });
    });
    peer.on('error', function(e){ if (isHub) return; api.status = (e && e.type === 'peer-unavailable') ? 'notfound' : 'error'; api.error = e && e.type; });
  }

  var room = {
    presence: function(patch){
      Object.keys(patch || {}).forEach(function(k){ if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; });
      mine = JSON.parse(JSON.stringify(mine));
      meObj = mk(myLabel, Object.freeze(JSON.parse(JSON.stringify(mine))), true); rebuild();
      if (mine.host && !isHub) startHub();   // opening a room makes this player the hub
      if (!isHub) sendMine();
      return Promise.resolve();
    },
    peers: function(){ if (!cache) rebuild(); return cache; },
    onPeers: function(f){ subs.push(f); setTimeout(function(){ f({peers:room.peers(), joined:[], left:[], updated:[]}); }, 0); return function(){ subs = subs.filter(function(x){ return x !== f; }); }; },
    onConnection: function(f){ csubs.push(f); setTimeout(function(){ f(connected); }, 0); return function(){}; },
    connected: function(){ return connected; },
    emit: function(){ return Promise.resolve(); },
    on: function(){ return function(){}; }
  };
  window.claude = { use: function(n){ return Promise.resolve(n === 'room' ? room : null); } };
  if (code) join(); else setConn(true);
})();

</script>
</head>
<body>
<title>NOXCAT FIGHT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: low-res pixel buffer upscaled full-bleed, camera on the cat; HUD mirrors a pixel roguelite
   (timer + yellow bar top-center, weapon hotbar bottom-center, party list top-left); menus are hard-edged pixel panels.
   Single dark look by choice: grey stone cave + NOXCAT lime. */
:root{
  --void:#15171b; --panel:#22252b; --panel-2:#2b2f36; --line:#3d424b; --shadow:#08090b;
  --ink:#eef0ea; --muted:#9ba1a9; --lime:#b8f03c; --lime-ink:#0b1203;
  --gold:#f5c542; --danger:#ff4f6d; --pink:#ff5aa5; --sky:#7fd8ff;
  --p1:#b8f03c; --p2:#5ec8ff; --p3:#ffc94a; --p4:#ff7ab0;
  --f-pixel:"Silkscreen","DotGothic16",ui-monospace,monospace;
  --f-num:"VT323","JetBrains Mono",ui-monospace,monospace; /* unambiguous digits (5≠S, 2≠Z) and % */
  --f-dot:"DotGothic16","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
ul,ol{margin:0;padding:0}dl,dd,p,h1,h2,h3{margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--void);image-rendering:pixelated}
button{font-family:inherit}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
#hud{position:fixed;inset:0 0 auto 0;z-index:10;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
#xpTop{height:4px;background:rgba(0,0,0,.5)}
#xpTop i{display:block;height:100%;width:0;background:var(--sky)}
.hud-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;padding:8px 16px 0}
.hud-l{display:flex;flex-direction:column;gap:5px;min-width:0}
.mini-bar{width:min(150px,100%);height:8px;background:rgba(0,0,0,.6);outline:2px solid var(--shadow)}
.mini-bar i{display:block;height:100%;width:100%;background:var(--danger)}
.hud-t{font:400 18px/1 var(--f-num);color:var(--ink);text-shadow:1px 1px 0 var(--shadow);display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.hud-t .pw{color:var(--lime);display:inline-flex;align-items:center;gap:4px}
.paw{width:12px;height:12px;flex:none}
#party{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.pm{display:grid;grid-template-columns:22px 70px auto;gap:6px;align-items:center;font:400 9px var(--f-pixel);color:var(--ink);text-shadow:1px 1px 0 var(--shadow)}
.pm b{color:var(--pc);font-weight:700}
.pm .mb{height:5px;background:rgba(0,0,0,.6);outline:1px solid var(--shadow)}
.pm .mb i{display:block;height:100%;background:var(--pc)}
.pm.down{opacity:.5}
.hud-c{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(300px,46vw)}
.timer{font:400 36px/0.9 var(--f-num);color:var(--ink);text-shadow:2px 2px 0 var(--shadow);font-variant-numeric:tabular-nums}
.ybar{position:relative;width:100%;height:9px;background:rgba(0,0,0,.6);outline:2px solid var(--shadow)}
.ybar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--gold)}
.ybar.boss i{background:linear-gradient(var(--gold),#e39b1f)}
.ybar span{position:absolute;inset:0;display:grid;place-items:center;font:400 8px/1 var(--f-dot);color:var(--shadow)}
.sub{font:400 9px var(--f-pixel);color:var(--muted);text-shadow:1px 1px 0 var(--shadow);letter-spacing:.06em}
.hud-r{display:flex;justify-content:flex-end;gap:8px}
.ibtn{pointer-events:auto;width:38px;height:38px;border:2px solid var(--shadow);background:rgba(34,37,43,.85);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
.ibtn:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.ibtn svg{width:16px;height:16px}
.ibtn.off{color:var(--muted)}
.bgm{font:400 10px var(--f-pixel);color:var(--ink);padding:4px 8px;border:2px solid var(--line);background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bgm[aria-pressed="true"]{color:var(--lime);border-color:var(--lime)}
.bgm:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bgm svg{width:12px;height:12px}
#hotbar{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:6px;pointer-events:none}
.hs{position:relative;width:42px;height:42px;background:rgba(20,22,26,.85);border:2px solid var(--shadow);box-shadow:inset 0 0 0 2px var(--tc,#2b2f36);display:grid;place-items:center;overflow:hidden}
.hs img{width:32px;height:32px}
.hs .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.55)}
.hs b{position:absolute;right:2px;bottom:1px;font:400 8px var(--f-pixel);color:var(--tc);text-shadow:1px 1px 0 var(--shadow)}
.hs.empty{opacity:.5}
#ultBtn{position:fixed;z-index:12;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:84px;height:84px;border:2px solid var(--shadow);background:rgba(20,22,26,.9);box-shadow:inset 0 0 0 2px var(--line),3px 3px 0 var(--shadow);color:var(--ink);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
#ultBtn i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--uc,var(--lime));opacity:.35;pointer-events:none}
#ultBtn span{position:relative}
#ultBtn .ut{font:400 16px/1 var(--f-dot)}
#ultLbl{font:400 18px/1 var(--f-num);max-width:78px;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:clip}
#ultBtn .uk{font:400 8px var(--f-pixel);color:var(--muted)}
#ultBtn.ready{box-shadow:inset 0 0 0 3px var(--uc),3px 3px 0 var(--shadow);animation:ultp .8s steps(2) infinite}
#ultBtn.ready i{opacity:.6}
#ultBtn.ready #ultLbl{font:400 12px/1.1 var(--f-dot);white-space:normal}
#ultBtn.active i{opacity:.8}
#ultBtn:disabled{cursor:default}
#ultBtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@keyframes ultp{50%{background:rgba(40,44,52,.95)}}
.char .ultline{color:var(--cc);font-size:12px}
#banner{position:fixed;z-index:11;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 96px);text-align:center;font:400 clamp(16px,3.6vw,24px)/1.3 var(--f-dot);color:var(--gold);text-shadow:2px 0 0 var(--shadow),-2px 0 0 var(--shadow),0 2px 0 var(--shadow),0 -2px 0 var(--shadow),2px 2px 0 var(--shadow);pointer-events:none}
#banner.show{animation:ban 2.2s steps(12) both}
@keyframes ban{0%{opacity:0;transform:translateY(6px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
#spect{position:fixed;z-index:11;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);font:400 14px var(--f-dot);color:var(--ink);background:rgba(8,9,11,.75);padding:6px 12px;border:2px solid var(--shadow);pointer-events:none}

/* Overlays */
.ov{position:fixed;inset:0;z-index:20;overflow-y:auto;background:rgba(14,15,18,.88);padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.wrap.narrow{max-width:760px}
.eyebrow,.label{font:400 11px var(--f-pixel);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.label{margin-bottom:-8px}
h2{font:400 clamp(28px,5vw,40px)/1.15 var(--f-dot);text-wrap:balance;text-shadow:3px 3px 0 var(--shadow)}
.panel{background:var(--panel);border:2px solid var(--shadow);box-shadow:inset 0 0 0 2px var(--line),4px 4px 0 var(--shadow)}
.btn{font:400 16px/1 var(--f-dot);border:2px solid var(--shadow);padding:13px 22px;background:var(--lime);color:var(--lime-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:3px 3px 0 var(--shadow);font-variant-numeric:tabular-nums}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn:focus-visible,.lvcard:focus-visible,.char:focus-visible,.lock:focus-visible,.mini:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.ghost{background:var(--panel-2);color:var(--ink)}
.btn.big{font-size:19px;padding:16px 28px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.short:disabled{opacity:1;background:var(--panel-2);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line),3px 3px 0 var(--shadow);font-size:14px}
.btn.short .paw{color:var(--danger)}
.btn .paw{width:14px;height:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}

/* Title */
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{font:700 16px var(--f-pixel);letter-spacing:.06em;color:var(--lime);text-shadow:2px 2px 0 var(--shadow)}
.chip{font:400 10px var(--f-pixel);color:var(--muted);padding:4px 8px;border:2px solid var(--line)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
h1{font:400 clamp(60px,13vw,124px)/.95 var(--f-dot);text-shadow:5px 5px 0 var(--shadow)}
h1 em{font-style:normal;color:var(--lime)}
.hero canvas{width:180px;height:155px}
.lede{font-size:16px;line-height:1.75;color:var(--muted);max-width:34em}
.lede b{color:var(--ink);font-weight:700}
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.char{text-align:left;color:var(--ink);background:var(--panel);border:2px solid var(--shadow);box-shadow:inset 0 0 0 2px var(--line),4px 4px 0 var(--shadow);padding:14px;cursor:pointer;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;min-width:0}
.char[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--cc,var(--lime)),4px 4px 0 var(--shadow);background:var(--panel-2)}
.char canvas{width:72px;height:62px}
.cn{font:400 18px var(--f-dot);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font:400 10px var(--f-pixel);padding:2px 6px;background:var(--cc,var(--lime));color:var(--lime-ink)}
.char canvas{background:color-mix(in srgb,var(--cc) 14%,transparent)}
.char p{font-size:13px;line-height:1.6;color:var(--muted);margin-top:4px}
.char .best{font:400 10px var(--f-pixel);color:var(--muted);margin-top:6px}
.hint{font-size:13px;line-height:1.7;color:var(--muted);max-width:44em}
.hint kbd{font:400 10px var(--f-pixel);padding:2px 6px;border:2px solid var(--line);color:var(--ink)}
.foes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.foe{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;min-width:0}
.foe canvas{width:64px;height:64px}
.foe span{font:400 13px var(--f-dot);text-align:center}
.foe small{font-size:11px;color:var(--muted);text-align:center;line-height:1.4}

.nick{display:flex;align-items:center;gap:10px;font:400 15px var(--f-dot);color:var(--muted);flex-wrap:wrap}
.nick input{font:400 16px var(--f-dot);color:var(--ink);background:var(--void);border:2px solid var(--line);padding:8px 10px;min-width:0;width:12em;max-width:100%}
.nick input:focus{outline:none;border-color:var(--lime)}
.invite{display:flex;gap:10px;flex-wrap:wrap}
.invite input{flex:1;min-width:0;font:400 14px var(--f-pixel);color:var(--lime);background:var(--void);border:2px solid var(--line);padding:10px}
.zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.zonec{padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:inset 0 3px 0 var(--zc),inset 0 0 0 2px var(--line),4px 4px 0 var(--shadow)}
.zt{font:400 10px var(--f-pixel);color:var(--zc)} .zn{font:400 17px var(--f-dot)}
.itemsx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ix{display:flex;gap:10px;align-items:center;padding:10px;min-width:0}.ix canvas{width:40px;height:40px;flex:none}.ix b{display:block;font:400 15px var(--f-dot);font-weight:400}.ix small{display:block;font-size:12px;color:var(--muted);line-height:1.4}
#zone{position:fixed;z-index:11;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);display:flex;align-items:center;gap:10px;padding:8px 14px 8px 12px;background:rgba(14,15,18,.86);border:2px solid var(--zc,var(--gold));box-shadow:3px 3px 0 var(--shadow);pointer-events:none}
#zone i{width:10px;height:10px;background:var(--zc);transform:rotate(45deg)}

/* ---------- pixel helpers ---------- */
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function crisp(c,outline=true,oc=[8,9,11]){
  const g=c.getContext('2d'),w=c.width,h=c.height,id=g.getImageData(0,0,w,h),d=id.data;
  for(let i=0;i<d.length;i+=4){d[i+3]=d[i+3]>110?255:0;}
  if(outline){const s=new Uint8Array(w*h);for(let p=0;p<w*h;p++)s[p]=d[p*4+3]?1:0;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=y*w+x;if(s[p])continue;
      if((x>0&&s[p-1])||(x<w-1&&s[p+1])||(y>0&&s[p-w])||(y<h-1&&s[p+w])){d[p*4]=oc[0];d[p*4+1]=oc[1];d[p*4+2]=oc[2];d[p*4+3]=255;}}}
  g.putImageData(id,0,0);return c;
}
function whiteOf(c){const w=canvas(c.width,c.height),g=w.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,w.width,w.height);return w;}
function fromMap(rows,pal,pad=1){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length,c=canvas(w+pad*2,h+pad*2),g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const col=pal[r[x]];if(col){g.fillStyle=col;g.fillRect(x+pad,y+pad,1,1);}}});return c;
}

const TAIL=[[12,29],[13,28],[13,29],[13,30],[14,27],[14,28],[14,29],[14,30],[14,31],[15,29],[16,29],[17,29],[18,29],[19,29],[20,29],[21,28],[21,29],[22,27],[22,28],[23,25],[23,26],[23,27],[24,22],[24,23],[24,24]];
function makeCat(ch){
  const rows=CAT_ROWS.map(r=>r.padEnd(34,'.').slice(0,34).split(''));
  for(const [y,x] of TAIL)rows[y][x]='B';
  for(let y=20;y<=22;y++)rows[y]=rows[y].map(c=>c==='W'?'A':c); // sleeves get their own colour, eye highlights stay white
  const pal=Object.assign({G:'#8a9099',g:'#3c4048',W:'#f1f3ee',E:'#b6f03a',e:'#5a9a16',K:'#08090b',T:'#ff7d9c',Y:'#b8f03c',O:'#121316',S:'#eceee9'},ch.pal);
  return crisp(fromMap(rows.map(r=>r.join('')),pal,1));
}
const CATS={},CATW={};for(const c of CHARS){CATS[c.id]=makeCat(c);CATW[c.id]=whiteOf(CATS[c.id]);}

    brow(r*0.12,-r*0.52,r*0.7,-r*0.32);
    g.strokeStyle='#d9dde3';g.lineWidth=r*0.16;g.beginPath();g.moveTo(r*0.88,r*0.08);g.lineTo(r*1.18,r*0.08);g.arc(r*1.18,r*0.4,r*0.32,-Math.PI/2,Math.PI*0.8);g.stroke();
  }else if(type==='bot'){
    g.fillStyle='#3a3f45';g.fillRect(-r*0.6,r*0.6,r*0.38,r*0.45);g.fillRect(r*0.22,r*0.6,r*0.38,r*0.45);

    g.fillStyle='#ff2e4d';ell(g,0,-r*1.24,r*0.2,r*0.2);g.fill();

  }else if(type==='rug'){

    for(let i=0;i<4;i++){const y=-h/2+h*(i+0.5)/4;g.fillRect(-w/2-r*0.22,y-1,r*0.22,2);g.fillRect(w/2,y-1,r*0.22,2);}

    g.fillStyle='#5e4f8a';ell(g,0,r*0.52,r*0.85,r*0.26);g.fill();

    g.fillStyle='#fff';g.fillRect(-r*0.08,r*0.42,r*0.16,r*0.4);g.fillRect(-r*0.2,r*0.54,r*0.4,r*0.16);

/* ---------- spawning (host / solo) ---------- */
function floorOK(x,y,m){if(solidAt(x,y)||solidAt(x+m,y)||solidAt(x-m,y)||solidAt(x,y+m)||solidAt(x,y-m))return false;for(const k of crystals)if(Math.hypot(k.x-x,k.y-y)<k.r+m)return false;return true;}
function allPlayers(){const a=[];if(!P.dead)a.push(P);for(const r of NET.remotes.values())if(!r.dead)a.push(r);return a;}
function spawnPoint(minD=270){const ps=allPlayers();for(let k=0;k<60;k++){const x=rand(60,W_W-60),y=rand(60,W_H-60);if(floorOK(x,y,30)&&ps.every(p=>Math.hypot(x-p.x,y-p.y)>minD))return {x,y};}return {x:W_W/2+200,y:W_H/2};}
function pickType(){const pool=[['phish',10]];if(wave>=3)pool.push(['bot',2+wave*0.25]);if(wave>=5)pool.push(['rug',2+wave*0.22]);if(wave>=7)pool.push(['fud',1.5+wave*0.16]);if(wave>=4)pool.push(['bomber',1.4+wave*0.12]);if(wave>=6)pool.push(['healer',0.7+wave*0.05]);if(wave>=8)pool.push(['shielder',0.7+wave*0.05]);if(wave>=9&&enemies.filter(e=>e.type==='ponzi').length<3)pool.push(['ponzi',0.35+wave*0.03]);
  let s=0;for(const p of pool)s+=p[1];let r=Math.random()*s;for(const p of pool){r-=p[1];if(r<=0)return p[0];}return 'phish';}
function makeFoe(type,x,y){const D=DIF(),d=FOES[type],hpMul=(1+(wave-1)*0.32+Math.max(0,wave-10)*0.15)*(1+0.55*(NET.nPlayers-1))*D.hp,hp=d.hp*hpMul;
  const e={id:nextId,type,x,y,r:d.r,hp,max:hp,spd:d.spd*(1+Math.min(0.3,(wave-1)*0.015))*D.spd,dmg:Math.round(d.dmg*(1+(wave-1)*0.12)*D.dmg),ai:d.ai,t:rand(0,9),flash:0,kx:0,ky:0,mode:'walk',mt:0,cd:rand(1,2.2),dx:0,dy:0,enraged:type==='bear'&&D.enrage>=1,hx:0,hy:0,hitT:0,shieldHp:0,shiny:false};
  if(type!=='bear'&&type!=='leek'&&Math.random()<1/140){e.shiny=true;e.hp*=1.6;e.max=e.hp;}
  if(e.enraged)setTimeout(()=>banner('熊市巨熊暴怒登場！','#ff8aa0'),0);
  nextId=(nextId+1)%46656||1;EM.set(e.id,e);return e;}
function spawnTick(dt){
  spawnT-=dt;if(spawnT>0)return;let iv=Math.max(0.3,1.2-wave*0.045)*rand(0.8,1.2)/DIF().spawn;if(wave===20)iv*=1.8;spawnT=iv;
  const cap=isMP()?120:150;if(enemies.length+teles.length>=cap)return;
  const g=1+Math.floor(wave/3)+(Math.random()<0.35?1:0)+Math.floor((NET.nPlayers-1)*0.7),p=spawnPoint();
  for(let i=0;i<g;i++){let x=p.x+rand(-45,45),y=p.y+rand(-45,45);if(!floorOK(x,y,16)){x=p.x;y=p.y;}teles.push({x,y,t:0.9,type:pickType()});}
}

const ULTS={

let noCharge=false;

const ultBase=()=>14*(1+(wave-1)*0.15);
function freezeAround(x,y,r,t){for(const e of enemies){if(!e.dead&&Math.hypot(e.x-x,e.y-y)<r+e.r)e.frozenT=Math.max(e.frozenT||0,t);}ebul=ebul.filter(b=>Math.hypot(b.x-x,b.y-y)>r);}

function castUlt(){
  if(state!=='play'||P.dead||P.energy<100||P.ult)return;
  trk('ult');
  const ch=CHARS.find(c=>c.id===P.char)||CHARS[0],base=ultBase();P.energy=0;
  banner(`${ULTS[ch.id].name}！`,ch.col);shake=Math.max(shake,0.3);sfx('boom');
  netFx('6'+CHARS.indexOf(ch)+b36(P.x/2,2)+b36(P.y/2,2));ultFx(ch.id,P.x,P.y);noCharge=true;
  if(ch.id==='nox'){for(const e of enemies){if(e.dead||e.ghost)continue;const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<150+e.r){const l=d||1;dealDamage(e,base*1.8,(e.x-P.x)/l,(e.y-P.y)/l,260);}}P.shieldT=0.8;P.ult={kind:'nox',t:0.4,tick:0};}
  else if(ch.id==='miner'){P.ult={kind:'miner',t:1.8,tick:0,n:8};P.magT=2;}
  else if(ch.id==='hacker'){if(!isClient())freezeAround(P.x,P.y,320,2);P.ult={kind:'hacker',t:2,tick:0};}
  else if(ch.id==='guard'){P.shieldT=3.5;heal(Math.round(maxHp()*0.15));P.ult={kind:'guard',t:3.5,tick:0};}

  else if(ch.id==='fomo'){P.ult={kind:'fomo',t:4.5,tick:0};P.tmp={as:45,dmg:25};P.tmpT=4.5;}

function updateUlt(dt){
  if(P.shieldT>0)P.shieldT-=dt;if(P.magT>0)P.magT-=dt;if(P.tmpT>0){P.tmpT-=dt;if(P.tmpT<=0)P.tmp=null;}
  const U=P.ult;if(!U)return;U.t-=dt;U.tick-=dt;const base=ultBase();noCharge=true;
  if(P.dead){P.ult=null;noCharge=false;return;}
  if(U.kind==='miner'&&U.tick<=0&&U.n>0){U.tick=0.2;U.n--;const near=enemies.filter(e=>!e.dead&&!e.ghost&&Math.hypot(e.x-P.x,e.y-P.y)<520);
    const tg=near.length?pick(near):{x:P.x+rand(-220,220),y:P.y+rand(-180,180)};
    shots.push({k:'lob',sx:tg.x+rand(-30,30),sy:tg.y-10,tx:tg.x,ty:tg.y,t:0,dur:0.42,base:base*0.9,aoe:56,tier:0,hgt:240});}
  if(U.kind==='flash'&&U.tick<=0){U.tick=0.15;const near=enemies.filter(e=>!e.dead&&!e.ghost&&Math.hypot(e.x-P.x,e.y-P.y)<400);
    if(near.length){const e=pick(near);fx.push({k:'bolt',nodes:[[e.x+rand(-20,20),e.y-260],[e.x,e.y]],life:0.2,max:0.2});fx.push({k:'flash',x:e.x,y:e.y,r:26,life:0.08,max:0.08});spark(e.x,e.y,true);sfx('zap');
      for(const o of enemies){if(!o.dead&&!o.ghost&&Math.hypot(o.x-e.x,o.y-e.y)<36+o.r)dealDamage(o,base*(o===e?0.8:0.3),0,1,60);}}}
  if(U.kind==='fomo'){if(Math.random()<0.9){const a=rand(0,TAU),r=rand(20,80);fx.push({k:'p',x:P.x+Math.cos(a)*r,y:P.y+Math.sin(a)*r,vx:rand(-10,10),vy:rand(-90,-40),life:0.35,max:0.35,col:pick(['#ff5a4a','#ffb347','#f5c542']),s:Math.random()<0.4?2:1});}
    if(U.tick<=0){U.tick=0.25;for(const e of enemies){if(!e.dead&&!e.ghost){const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<80+e.r){const l=d||1;dealDamage(e,base*0.22,(e.x-P.x)/l,(e.y-P.y)/l,40);}}}}}
  if(U.kind==='guard'){for(const e of enemies){if(e.dead||e.ghost)continue;const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<40+e.r&&(!e.bumpT||tAll>e.bumpT)){e.bumpT=tAll+0.5;const l=d||1;dealDamage(e,base*0.4,(e.x-P.x)/l,(e.y-P.y)/l,340);}}}
  noCharge=false;if(U.t<=0)P.ult=null;
}

const DREWARD=15,BANKMAX=45;
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function loadJ(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v&&typeof v==='object'?v:d;}catch(e){return d;}}
let META=loadJ('noxcat_meta',{});META.ach=META.ach||{};META.st=Object.assign({kills:0,runs:0,clears:0,shiny:0,whale:0,ults:0,items:0,days:0,cats:{}},META.st||{});META.bank=META.bank|0;
let DAILY=loadJ('noxcat_daily',null);
function makeDaily(key){const r=mulberry(hashStr('noxcat'+key)),ids=Object.keys(DTASKS);for(let i=ids.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  const pickd=[];for(const id of ids){if(pickd.length>=3)break;if((id==='catwave'||id==='hardwave')&&pickd.some(t=>t.t==='catwave'||t.t==='hardwave'))continue;pickd.push(Object.assign({t:id,p:0,done:false},DTASKS[id](r)));}
  return {date:key,tasks:pickd,full:false};}
function ensureDaily(){const k=todayKey();if(!DAILY||DAILY.date!==k||!Array.isArray(DAILY.tasks)){DAILY=makeDaily(k);saveMeta(true);}}
let metaDirty=false,metaSaveT=0;
function saveMeta(now){metaDirty=true;if(!now&&performance.now()-metaSaveT<2000)return;metaSaveT=performance.now();metaDirty=false;try{localStorage.setItem('noxcat_meta',JSON.stringify(META));localStorage.setItem('noxcat_daily',JSON.stringify(DAILY));}catch(e){}}
setInterval(()=>{if(metaDirty)saveMeta(true);},2500);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&metaDirty)saveMeta(true);});
let runAch=[];
function ach(id){if(META.ach[id])return;const a=ACHS.find(x=>x.id===id);if(!a)return;META.ach[id]=Date.now();runAch.push(id);saveMeta(true);toast('成就解鎖！',`${a.name}　${a.desc}`,'#ffd166');sfx('lvl');}
function dprog(t,v,set){ensureDaily();if(t.done)return;t.p=set?Math.max(t.p,v):t.p+v;if(t.p>=(t.goal||t.n)){t.p=t.goal||t.n;t.done=true;META.bank=Math.min(BANKMAX,META.bank+DREWARD);
    toast('每日挑戰完成',`${t.label}　下一局開局爪幣 +${DREWARD}`,'#7fd8ff');
    if(!DAILY.full&&DAILY.tasks.every(x=>x.done)){DAILY.full=true;META.st.days++;ach('d1');if(META.st.days>=7)ach('d7');}saveMeta(true);}else saveMeta();}
function trk(ev,a,b){
  ensureDaily();const S=META.st,T=DAILY.tasks;
  if(ev==='kill'){S.kills++;if(a==='whale')S.whale++;if(b)S.shiny++;
    ach('first');if(S.kills>=1000)ach('k1k');if(S.kills>=10000)ach('k10k');if(S.whale>=10)ach('whale');if(b){ach('shiny');if(S.shiny>=5)ach('shiny5');}
    for(const t of T){if(t.t==='kills')dprog(t,1);else if(t.t==='type'&&t.k===a)dprog(t,1);}saveMeta();}
  else if(ev==='ult'){S.ults++;if(S.ults>=50)ach('ult50');for(const t of T)if(t.t==='ults')dprog(t,1);}
  else if(ev==='item'){S.items++;if(S.items>=30)ach('items');for(const t of T)if(t.t==='items')dprog(t,1);}
  else if(ev==='paws'){for(const t of T)if(t.t==='paws')dprog(t,a);if(P.paws>=500)ach('rich');}
  else if(ev==='wave'){const n=a;if(n>=10)ach('w10');if(isMP())ach('coop');if(P.paws>=500)ach('rich');
    for(const t of T){if(t.t==='catwave'&&P.char===t.c&&n>=t.n)dprog(t,1,true);else if(t.t==='hardwave'&&DIF().id!=='easy'&&n>=t.n)dprog(t,1,true);}
    if(b&&n>=3){ach('clean');for(const t of T)if(t.t==='clean')dprog(t,1,true);}}
  else if(ev==='evo'){if(a>=2)for(const t of T)if(t.t==='evo')dprog(t,1,true);if(a>=3)ach('evo');if(P.weapons.length>=6)ach('six');}
  else if(ev==='six'){if(P.weapons.length>=6)ach('six');}
  else if(ev==='lvl'){if(P.lvl>=15)ach('lv15');}
  else if(ev==='start'){S.runs++;S.cats[a]=1;if(CHARS.every(c=>S.cats[c.id]))ach('cats');saveMeta(true);}
  else if(ev==='end'){if(a){S.clears++;trk('wave',20,false);ach(DIF().id);}saveMeta(true);}
  saveMeta();
}

}

function applyHit(e,d,kx,ky,kb,mine,slot){

function nearest(x,y,range,skip){let best=null,bd=Infinity;for(const e of enemies){if(e.dead||e.ghost||(skip&&skip.has(e)))continue;const d=Math.hypot(e.x-x,e.y-y)-e.r;if(d<range&&d<bd){bd=d;best=e;}}return best;}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));}

/* ---------- update ---------- */
function updateFx(dt){
  for(const f of fx){f.life-=dt;if(f.k==='p'||f.k==='smoke'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=0.9;f.vy*=0.9;}}

  fx=fx.filter(f=>f.life>0);for(const n of nums){n.life-=dt;n.y+=n.vy*dt;n.vy*=0.9;}nums=nums.filter(n=>n.life>0);

function update(dt){
  tAll+=dt;
  if(winT>0){winT-=dt;if(winT<=0){if(isMP())mpOver(true);else{state='over';setHud(false);BEST[bestKey(charId)]=21;saveBest();showOver(true);}return;}}
  // move
  if(!P.dead){
    let mx=0,my=0;
    if(!menuOpen){if(keys['a']||keys['arrowleft'])mx-=1;if(keys['d']||keys['arrowright'])mx+=1;if(keys['w']||keys['arrowup'])my-=1;if(keys['s']||keys['arrowdown'])my+=1;
      if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>6){const k=Math.min(1,l/56);mx+=dx/l*k;my+=dy/l*k;}}}
    const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
    const sp=230*Math.max(0.4,1+stat('speed')/100);P.x+=mx*sp*dt;P.y+=my*sp*dt;collide(P,14);charge(Math.min(1,ml)*sp*dt*0.011);
    P.moving=ml>0.1;if(mx<-0.1)P.face=-1;else if(mx>0.1)P.face=1;
    const rg=stat('regen');if(rg>0){P.regenAcc+=rg*0.12*dt;while(P.regenAcc>=1){P.regenAcc-=1;heal(1);}}
  }
  P.inv=Math.max(0,P.inv-dt);shake=Math.max(0,shake-dt);
  if(isClient())clientSim(dt);else if(hostSim(dt)===false)return;
  // my weapons
  if(!P.dead){
    const n=P.weapons.length,range0=1+stat('range')/100,asm=1+Math.max(-50,stat('as'))/100;
    P.weapons.forEach((w,i)=>{
      const def=WEAPONS[w.type],ang=(i/n)*TAU+(n>1?-Math.PI/2:0),bx=P.x+Math.cos(ang)*38,by=P.y-6+Math.sin(ang)*28,range=def.range*range0;
      w.cd-=dt;w.kick=Math.max(0,w.kick-dt*8);const tg=nearest(bx,by,range);
      if(tg&&!w.thrust){let d=Math.atan2(tg.y-by,tg.x-bx)-w.ang;d=Math.atan2(Math.sin(d),Math.cos(d));w.ang+=d*Math.min(1,dt*16);}
      let wx=bx-Math.cos(w.ang)*w.kick*6,wy=by-Math.sin(w.ang)*w.kick*6;
      if(w.thrust){const Th=w.thrust;Th.t+=dt;const p=Math.min(1,Th.t/Th.dur),ext=Math.sin(p*Math.PI)*Th.L;w.ang=Th.a;wx=bx+Math.cos(Th.a)*ext;wy=by+Math.sin(Th.a)*ext;
        if(Math.random()<0.6)fx.push({k:'after',img:WICT[w.type][w.tier],x:wx,y:wy,a:Th.a,life:0.1,max:0.1});
        for(const e of enemies){if(!e.dead&&!e.ghost&&!Th.hit.has(e)&&Math.hypot(e.x-wx,e.y-wy)<e.r+Th.rad){Th.hit.add(e);dealDamage(e,Th.base,Math.cos(Th.a),Math.sin(Th.a),160);}}
        if(Th.wave&&!Th.waved&&p>=0.5){Th.waved=true;fx.push({k:'ring',x:wx,y:wy,r:58,life:0.22,max:0.22,col:TIERC[3]});spark(wx,wy,true);sfx('boom');
          for(const e of enemies){if(!e.dead&&!e.ghost&&Math.hypot(e.x-wx,e.y-wy)<58+e.r){const l=Math.hypot(e.x-wx,e.y-wy)||1;dealDamage(e,Th.base*0.6,(e.x-wx)/l,(e.y-wy)/l,200);}}}
        if(p>=1)w.thrust=null;}

/* ---------- loop ---------- */
let last=performance.now(),lobbyT=0,goT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  try{netTick(dt);}catch(e){}
  if(state==='play')update(dt);
  else if(state==='dying'){tAll+=dt;dieT-=dt;updateFx(dt*0.5);shake=Math.max(0,shake-dt);if(dieT<=0){state='over';setHud(false);showOver(false);}}
  else tAll+=dt*0.5;
  render();hud(dt);musicUpdate();
  lobbyT-=dt;if(lobbyT<=0&&state==='title'&&lobbyDirty){lobbyT=0.25;lobbyDirty=false;renderLobby();}
  goT-=dt;if(goT<=0&&state==='between'&&isMP()&&!$('#shop').hidden){goT=0.4;renderGo();}
  if(state==='title'&&NET.room)lobbyDirty=true;
  requestAnimationFrame(frame);
}

  const gotAch=runAch.length?`<div class="gotach"><span class="eyebrow">本局解鎖成就</span><div class="items">${runAch.map(id=>{const a=ACHS.find(x=>x.id===id);return `<span class="item panel"><span class="glyph">${esc(a.g)}</span>${esc(a.name)}</span>`;}).join('')}</div></div>`:'';
  $('#over').innerHTML=`<div class="wrap narrow"><div><p class="eyebrow">${win?'ALL CLEAR':'GAME OVER'} · ${DIF().tag}${mp?' · CO-OP':''}</p><h2>${win?'錢包守住了！':'錢包被攻破了'}</h2></div>
    <p class="verdict">${msg?esc(msg):win?'熊市巨熊倒下，二十波攻勢全數擋下。換個角色，試試不同的組合。':mp?`隊伍撐到了第 ${wave} 波。多買護甲或閃避，或把同級武器合成升級。`:`${ch.name}撐到了第 ${wave} 波。試著多買護甲或閃避，或把同級武器合成升級。`}</p>
    <dl class="result"><div class="panel"><dt>抵達波數</dt><dd>${win?20:wave}</dd></div><div class="panel"><dt>你的擊倒</dt><dd>${P.kills}</dd></div><div class="panel"><dt>等級</dt><dd>${P.lvl}</dd></div><div class="panel"><dt>武器數</dt><dd>${P.weapons.length}</dd></div></dl>${gotAch}${dailyHtml(true)}
    <div class="row">${mp?`<button class="btn big" data-act="menu">回到大廳</button>`:`<button class="btn big" data-act="again">用${ch.name}再來一局</button><button class="btn ghost" data-act="menu">換角色</button>`}</div></div>`;
  showOnly('#over');
}
$('#ach').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='close'){renderTitle();showOnly('#title');}});
$('#over').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='again'){ensureAudio();initRun(charId);}else backToTitle();});
$('#pauseBtn').addEventListener('click',()=>{if(state==='play')pauseGame();});
$('#ultBtn').addEventListener('click',e=>{e.preventDefault();ensureAudio();castUlt();$('#ultBtn').blur();});

genMap(randi(1,2e9));renderTitle();showOnly('#title');requestAnimationFrame(frame);
initNet();
})();
</script>

</body>
</html>
